name: Claude Review with Tracking

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        description: 'Anthropic API key for Claude Code'

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The pr-review skill lives in the private Clever/eng-ai-tools repo. A
      # reusable workflow runs with the caller's repo-scoped GITHUB_TOKEN, so it
      # cannot check that repo out; referencing it as an action works because the
      # runner fetches org-accessible actions with its own token, no secret needed.
      - name: Load the shared clever-core plugin
        id: skills
        uses: Clever/eng-ai-tools/.github/actions/load-plugins@master
        with:
          plugin: clever-core

      - name: Verify the pr-review skill is present
        run: test -f "${{ steps.skills.outputs.plugin-dir }}/skills/pr-review/SKILL.md"

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            /pr-review
          # --strict-mcp-config stops the plugin's declared MCP servers (linear, guru, chrome-devtools) from starting on the runner
          claude_args: |
            ${{ steps.skills.outputs.plugin-args }}
            --strict-mcp-config
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rebase:*),Bash(git reset:*),Bash(git checkout:*),Bash(git merge:*),Bash(git cherry-pick:*)"
