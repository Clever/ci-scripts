name: Reusable Crowdin Upload Sources

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      prepare_command:
        description: 'Generates the source catalog before upload. Empty skips Lingui install and extraction.'
        type: string
        default: 'npx lingui extract-template'
    secrets:
      CROWDIN_PROJECT_ID:
        required: true
      CROWDIN_PERSONAL_TOKEN:
        required: true

jobs:
  upload-sources-to-crowdin:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Lingui CLI
        if: inputs.prepare_command != ''
        run: |
          cd "$(mktemp -d)"
          npm init -y
          npm install @lingui/cli @lingui/format-po @lingui/conf
          ln -s "$(pwd)/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Generate source catalog
        if: inputs.prepare_command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: eval "$PREPARE_COMMAND"

      - name: Crowdin Action
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
