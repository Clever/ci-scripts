name: Reusable Crowdin Download Translations

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      prepare_command:
        description: 'Generates the source catalog before download. Empty skips Lingui install and extraction.'
        type: string
        default: 'npx lingui extract-template'
      localization_branch_name:
        type: string
        default: 'l10n_crowdin_translations'
      pull_request_assignees:
        description: 'Comma-separated GitHub logins to assign to the translations PR'
        type: string
        default: ''
      pull_request_body:
        description: 'Body of the translations PR'
        type: string
        default: 'New Crowdin translations by Crowdin GH Action'
      translation_paths:
        description: 'Space-separated pathspecs for translation files; only these are checked for changes and committed'
        type: string
        default: '*.po'
    secrets:
      CROWDIN_PROJECT_ID:
        required: true
      CROWDIN_PERSONAL_TOKEN:
        required: true
      CROWDIN_GH_TOKEN:
        required: true

jobs:
  download-from-crowdin:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Lingui CLI
        if: inputs.prepare_command != ''
        run: |
          cd "$(mktemp -d)"
          npm init -y
          npm install @lingui/cli @lingui/format-po @lingui/conf
          ln -s "$(pwd)/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Generate source catalog
        if: inputs.prepare_command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: eval "$PREPARE_COMMAND"

      - name: Crowdin Action
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.CROWDIN_GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Detect real translation changes
        id: diff
        env:
          TRANSLATION_PATHS: ${{ inputs.translation_paths }}
        run: |
          # Staging first so new locale files count; unquoted so multiple pathspecs split, set -f so the shell doesn't expand globs
          set -f
          git add -A -- $TRANSLATION_PATHS
          # Header dates and #: source references churn without any translation change
          if git diff --cached -I '^"PO-Revision-Date:' -I '^"POT-Creation-Date:' -I '^#: ' --quiet; then
            echo "Only PO-Revision-Date, POT-Creation-Date or #: reference lines changed (or nothing); skipping PR."
            git reset --hard
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh translations PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_GH_TOKEN }}
          BRANCH: ${{ inputs.localization_branch_name }}
          PR_BODY: ${{ inputs.pull_request_body }}
          PR_ASSIGNEES: ${{ inputs.pull_request_assignees }}
        run: |
          git config user.name "Crowdin Bot"
          git config user.email "support+bot@crowdin.com"
          git checkout -B "$BRANCH"
          git commit -m "New Crowdin translations"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Open PR already exists for $BRANCH; branch refreshed."
            exit 0
          fi

          args=(--head "$BRANCH" --base master --title "New Crowdin Translations" --body "$PR_BODY")
          if [ -n "$PR_ASSIGNEES" ]; then
            args+=(--assignee "$PR_ASSIGNEES")
          fi
          gh pr create "${args[@]}"
