name: Reusable Crowdin Download Translations

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      prepare_command:
        description: 'Generates the source catalog before download. Empty skips Lingui install and extraction.'
        type: string
        default: 'npx lingui extract-template'
      localization_branch_name:
        type: string
        default: 'l10n_crowdin_translations'
      pull_request_assignees:
        description: 'Comma-separated GitHub logins to assign to the translations PR'
        type: string
        default: ''
    secrets:
      CROWDIN_PROJECT_ID:
        required: true
      CROWDIN_PERSONAL_TOKEN:
        required: true
      CROWDIN_GH_TOKEN:
        required: true

jobs:
  download-from-crowdin:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Lingui CLI
        if: inputs.prepare_command != ''
        run: |
          cd "$(mktemp -d)"
          npm init -y
          npm install @lingui/cli @lingui/format-po @lingui/conf
          ln -s "$(pwd)/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Generate source catalog
        if: inputs.prepare_command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: eval "$PREPARE_COMMAND"

      - name: Crowdin Action
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: ${{ inputs.localization_branch_name }}
          create_pull_request: true
          pull_request_title: New Crowdin Translations
          pull_request_body: New Crowdin translations by Crowdin GH Action
          pull_request_base_branch_name: master
          pull_request_assignees: ${{ inputs.pull_request_assignees }}
        env:
          GITHUB_TOKEN: ${{ secrets.CROWDIN_GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
